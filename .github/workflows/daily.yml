name: journal-alert daily

# 07:30 Asia/Shanghai == 23:30 UTC (previous day).
# GitHub cron always uses UTC.
on:
  schedule:
    - cron: "30 23 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "覆盖时间窗（天）。留空 = 用 config.json 的自适应窗口"
        required: false
        default: ""

      sources:
        description: "只跑指定数据源，逗号分隔（如 openalex,crossref）。留空 = 全部"
        required: false
        default: ""

# Allow the workflow to commit reports and deduplication state back to the repo.
permissions:
  contents: write

# Avoid overlapping runs.
concurrency:
  group: journal-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Use Beijing time for report date and logs.
      TZ: Asia/Shanghai

      # QQ email settings from GitHub Secrets.
      JALERT_EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      JALERT_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      JALERT_EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # Contact email for OpenAlex / Crossref polite pool.
      JALERT_MAILTO: ${{ secrets.EMAIL_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Diagnostic only.
      # Temporary network failures should not stop the real daily run.
      - name: Environment self-check
        continue-on-error: true
        run: python run.py --doctor

      - name: Run pipeline
        env:
          EXTRA_DAYS: ${{ inputs.days }}
          EXTRA_SOURCES: ${{ inputs.sources }}
        run: |
          set -eu

          ARGS="--once"

          if [ -n "${EXTRA_DAYS}" ]; then
            ARGS="$ARGS --days ${EXTRA_DAYS}"
          fi

          if [ -n "${EXTRA_SOURCES}" ]; then
            ARGS="$ARGS --sources ${EXTRA_SOURCES}"
          fi

          echo "python run.py ${ARGS}"
          python run.py ${ARGS}

      # Save reports and deduplication state back to GitHub.
      - name: Commit state and report back
        if: always()
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore(state): $(date +%F) daily run"
            git push
          fi

      # Keep logs and daily snapshots for diagnostics.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            state/daily/
          if-no-files-found: ignore
          retention-days: 90

      # Show today's report on the GitHub Actions run page.
      - name: Job summary
        if: always()
        run: |
          report="reports/$(date +%F).md"

          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有生成当日报告，请查看上面步骤的日志。" >> "$GITHUB_STEP_SUMMARY"
          fi
